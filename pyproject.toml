[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narratopro-v1"
version = "0.1.0"
description = "Production-grade AI short-drama marketing system"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentimelineio==0.18.1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "temporalio>=1.8,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7,<2",
  "httpx>=0.27,<1",
  "hypothesis>=6,<7",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pyyaml>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
narratopro = "apps.cli.main:main"
narratopro-api = "apps.api.main:run"
narratopro-worker = "apps.worker.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*", "workflows*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["demo_frames", "data/local", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["apps", "packages", "workflows"]
exclude = ["tests/fixtures/architecture_failures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["apps", "packages", "workflows"]

[tool.coverage.report]
show_missing = true
fail_under = 80
