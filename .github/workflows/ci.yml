name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: narratopro
          POSTGRES_USER: narratopro
          POSTGRES_PASSWORD: narratopro-dev-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U narratopro -d narratopro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NARRATOPRO_DATABASE_URL: postgresql+psycopg://narratopro:narratopro-dev-local@127.0.0.1:5432/narratopro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: make check
      - run: docker compose --env-file deploy/compose/.env.example -f deploy/compose/docker-compose.yml config --quiet

  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @narratopro/review-web typecheck
      - run: pnpm --filter @narratopro/review-web build
